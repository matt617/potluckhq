version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the Lambda and CI runtime (Node 22). Raise together with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
      cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs']
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
